<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" role="img" aria-label="Student">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b896"/>
      <stop offset="100%" stop-color="#c68642"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#2f5fbf"/>
    </linearGradient>
  </defs>
  <!-- backpack -->
  <rect x="340" y="280" width="90" height="160" rx="18" fill="#1f1f2e"/>
  <rect x="355" y="300" width="60" height="50" rx="8" fill="#3a3a4a"/>
  <!-- torso / denim shirt -->
  <path d="M150 300c20-40 80-70 140-70s120 30 140 70l30 260H120z" fill="url(#shirt)"/>
  <path d="M220 240c10-8 30-12 50-12s40 4 50 12l8 40H212z" fill="#f5f5f5"/>
  <!-- head -->
  <ellipse cx="290" cy="170" rx="78" ry="88" fill="url(#skin)"/>
  <path d="M220 150c10-70 60-100 120-90 20 40 10 90-10 110-40-10-80-5-110-20z" fill="#2b1d14"/>
  <!-- smile -->
  <path d="M260 200c12 16 40 16 52 0" fill="none" stroke="#8d5524" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="265" cy="170" r="6" fill="#2b1d14"/>
  <circle cx="315" cy="170" r="6" fill="#2b1d14"/>
  <!-- notebooks -->
  <g transform="translate(160 420) rotate(-12)">
    <rect width="110" height="140" rx="8" fill="#c4007a"/>
    <rect x="10" y="16" width="90" height="8" rx="2" fill="#fff" opacity=".35"/>
    <rect x="10" y="36" width="70" height="8" rx="2" fill="#fff" opacity=".25"/>
  </g>
  <g transform="translate(210 440) rotate(8)">
    <rect width="100" height="130" rx="8" fill="#d4b483"/>
    <rect x="10" y="18" width="80" height="6" rx="2" fill="#a07840" opacity=".5"/>
  </g>
</svg>
